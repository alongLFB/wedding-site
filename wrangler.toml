name = "euka-events-cms"
main = "worker.js"
compatibility_date = "2024-08-01"

# Environment Variables
[vars]
R2_PUBLIC_DOMAIN = "https://pub-r2.eukaevents.com"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "eukaevents-db"
database_id = "your-d1-database-id-here"

# Cloudflare R2 Object Storage Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "eukaevents-media"
preview_bucket_name = "eukaevents-media-preview"
